[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "em_health"
dynamic = ["version"]
authors = [{name = "Grigory Sharov", email = "gsharov@mrclmb.ac.uk"}]
description = "EMHealth is a Python package designed for continuous monitoring of the performance and health metrics of Thermo Fisher Scientific electron microscopes."
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10,<3.16"
keywords = ["microscope", "health monitoring", "TEM", "SEM"]
classifiers=[
    'Development Status :: 3 - Alpha',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Operating System :: POSIX :: Linux',
]
license = "GPL-3.0-or-later"
dependencies = [
    'psycopg[binary]',
    'watchdog>=6',
    'python-dotenv',
    'packaging',
    'podman-compose>=1.6.0',
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "memory-profiler"]
docs = ["sphinx>=8.0.0", "sphinx_rtd_theme>=3.0.0"]

[project.urls]
Homepage = "https://github.com/azazellochg/em_health"
Documentation = "https://em-health.readthedocs.io"
Issues = "https://github.com/azazellochg/em_health/issues"

[project.scripts]
emhealth = "em_health.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["em_health*"]

[tool.setuptools.package-data]
em_health = [
    "instruments.json",
    "sql/**/*.sql",
    "tests/*.xml.gz",
    "utils/*.sh"
]

[tool.setuptools.dynamic]
version = {attr = "em_health.__version__"}

[tool.mypy]
python_version = "3.10"
files = ["em_health"]

[tool.ruff]
target-version = "py310"
include = ["em_health/**/*.py"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E9",   # syntax and IO errors
    "B",    # flake8-bugbear
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]
