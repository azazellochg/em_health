name: Build & Publish Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set env vars
        run: |
          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/timescaledb" >> $GITHUB_ENV
          echo "VERSION=0.1a5" >> $GITHUB_ENV
          echo "DESC=Postgres 18.3 + TimescaleDB 2.25.2 + Toolkit 1.22.0 + TDS-FDW 2.0.5" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: |
            type=raw,value=${{ env.IMAGE_NAME }}:latest
            type=raw,value=${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=Custom PostgreSQL image with TimescaleDB, Toolkit & TDS-FDW
            org.opencontainers.image.description=${{ env.DESC }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.authors=Grigory Sharov <gsharov@mrc-lmb.cam.ac.uk>
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/azazellochg/em_health
          annotations: |
            org.opencontainers.image.title=Custom PostgreSQL image with TimescaleDB, Toolkit & TDS-FDW
            org.opencontainers.image.description=${{ env.DESC }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.authors=Grigory Sharov <gsharov@mrc-lmb.cam.ac.uk>
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/azazellochg/em_health
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
