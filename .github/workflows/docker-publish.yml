name: Build & Publish Docker Image To GHCR

# Image versioning is independent of the Python package version:
#   - image tag:          docker/compose.yaml (services.timescaledb.image)
#   - component versions: ARG lines in docker/Dockerfile
# Bump the tag in compose.yaml whenever docker/Dockerfile changes, then run this workflow.

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.actor }}/timescaledb

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # elevate from default read-only in repo settings; needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read image tag and component versions
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          df=docker/Dockerfile

          image_tag=$(yq '.services.timescaledb.image | split(":") | .[-1]' docker/compose.yaml)
          pg=$(sed -n 's/^ARG PG_IMAGE=.*postgres:\([0-9][0-9.]*[0-9]\).*/\1/p' "$df")
          ts=$(sed -n 's/^ARG TS_VERSIONS="\(.*\)"$/\1/p' "$df" | awk '{print $NF}')  # last = default version
          tlk=$(sed -n 's/^ARG TLK_VERSION=//p' "$df")
          tds=$(sed -n 's/^ARG TDS_VERSION=v\{0,1\}//p' "$df")

          for name in image_tag pg ts tlk tds; do
            if [ -z "${!name}" ] || [ "${!name}" = "null" ]; then
              echo "::error::Could not read '$name' from docker/compose.yaml or docker/Dockerfile"
              exit 1
            fi
          done

          desc="Postgres ${pg} + TimescaleDB ${ts} + Toolkit ${tlk} + TDS-FDW ${tds}"
          echo "Image tag:   ${image_tag}"
          echo "Description: ${desc}"

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          # Same key=value list is used for both image labels and manifest annotations
          {
            echo "metadata<<EOF"
            echo "org.opencontainers.image.title=Custom PostgreSQL image with TimescaleDB, Toolkit & TDS-FDW"
            echo "org.opencontainers.image.description=${desc}"
            echo "org.opencontainers.image.version=${image_tag}"
            echo "org.opencontainers.image.authors=Grigory Sharov <gsharov@mrclmb.ac.uk>"
            echo "org.opencontainers.image.licenses=GPL-3.0-or-later"
            echo "org.opencontainers.image.source=https://github.com/azazellochg/em_health"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse to overwrite an existing image tag
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          if docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" > /dev/null 2>&1; then
            echo "::error::${IMAGE_NAME}:${IMAGE_TAG} already exists. Bump the image tag in docker/compose.yaml."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.image_tag }}
          labels: ${{ steps.vars.outputs.metadata }}
          annotations: ${{ steps.vars.outputs.metadata }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: linux/amd64
          sbom: false
          provenance: false
