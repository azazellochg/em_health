name: master to pypi
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # later steps don't use git, so don't leave the token in .git

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: build release distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install --no-deps .
          python -m build --sdist
          twine check dist/*

      - name: upload dist
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

      - name: Get package version
        id: version
        run: |
          VERSION=$(python -c 'from importlib.metadata import version; print(version("em_health"))')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      id-token: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    runs-on: ubuntu-latest
    needs: [build, pypi-publish]
    permissions:
      contents: write
    steps:
      - name: Create Git tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" -f sha="${GITHUB_SHA}"
