name: emhealth

services:
  timescaledb:
    image: ghcr.io/azazellochg/timescaledb:0.1a6
    container_name: emhealth-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
      - ../em_health/sql:/sql:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./pgtune.sh:/docker-entrypoint-initdb.d/pgtune.sh:ro
      - ./reset-db.sh:/usr/local/bin/reset-db.sh:ro
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ${BACKUP_DIR}:/backups
    command: >
      postgres
      -c timescaledb.enable_chunk_skipping=on
      -c timescaledb.enable_cagg_window_functions=true
      -c shared_preload_libraries=timescaledb,pg_stat_statements,auto_explain
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=top
      -c pg_stat_statements.track_planning=on
      -c pg_stat_statements.track_utility=off
      -c track_io_timing=on
      -c logging_collector=on
      -c log_destination='csvlog'
      -c log_rotation_size=0
      -c log_rotation_age=24h
      -c log_truncate_on_rotation=on
      -c log_filename='postgresql-%Y-%m-%d.log'
      -c log_line_prefix=''
      -c log_autovacuum_min_duration=0
      -c auto_explain.log_format='json'
      -c auto_explain.log_min_duration=${MIN_QUERY_EXPLAIN}
      -c auto_explain.log_analyze=on
      -c auto_explain.log_buffers=on
      -c auto_explain.log_timing=off
      -c auto_explain.log_parameter_max_length=0
      -c archive_command='pgbackrest --stanza=main archive-push %p'
      -c archive_mode=on
      -c max_wal_senders=3
      -c wal_level=replica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    networks:
      - emhealth-net

  renderer:
    image: docker.io/grafana/grafana-image-renderer:v5.8.3@sha256:25315b071f540f01ba7265a0e3ea299afcf80db13664646a92ea21f92f63714c
    container_name: emhealth-renderer
    restart: unless-stopped
    command: server --server.auth-token ${GRAFANA_RENDER_TOKEN}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    networks:
      - emhealth-net

  grafana:
    image: docker.io/grafana/grafana:13.1.0-25893932881@sha256:aea3197f32a06715686c5672db2c143af2c3993724fef51534594468cb5d39ff
    container_name: emhealth-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD} # initial password, used only on first startup
      GF_SECURITY_DISABLE_GRAVATAR: true
      GF_AUTH_ANONYMOUS_HIDE_VERSION: true
      GF_LIVE_MAX_CONNECTIONS: 0
      GF_METRICS_ENABLED: false
      GF_SERVER_ENABLE_GZIP: true
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED} # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#smtp
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_EMAIL_FROM}
      GF_SMTP_FROM_NAME: EMHealth
      GRAFANA_EMAIL_TO: ${GRAFANA_EMAIL_TO}
      GF_SMTP_SKIP_VERIFY: ${GRAFANA_SMTP_SKIP_VERIFY}
      GF_RENDERING_SERVER_URL: http://emhealth-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://emhealth-grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDER_TOKEN}
      GF_UNIFIED_ALERTING_SCREENSHOTS_CAPTURE: true # https://grafana.com/docs/grafana/latest/alerting/configure-notifications/template-notifications/images-in-notifications/#configuration
      GF_USERS_DEFAULT_THEME: system
      GF_USERS_ALLOW_SIGN_UP: false
      #GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/TEM/Fleet overview.json"
      EMHEALTH_DEBUG: ${EMHEALTH_DEBUG}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ${BACKUP_DIR}:/backups
    tmpfs:
      - /var/lib/grafana/plugins   # keeps plugins in container only
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    networks:
      - emhealth-net

volumes:
  pgdata:
  grafana-storage:
networks:
  emhealth-net:
    name: emhealth-net
