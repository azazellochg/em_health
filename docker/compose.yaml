name: emhealth

services:
  timescaledb:
    # Image version (independent of the Python package version). Bump it whenever
    # docker/Dockerfile changes; CI publishes the image under this tag.
    image: ghcr.io/azazellochg/timescaledb:12
    container_name: emhealth-db
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD}
      POSTGRES_EMHEALTH_PASSWORD: ${POSTGRES_EMHEALTH_PASSWORD}
      POSTGRES_PGANALYZE_PASSWORD: ${POSTGRES_PGANALYZE_PASSWORD}
      TBL_DATA_CHUNK_SIZE: ${TBL_DATA_CHUNK_SIZE}
      TBL_STATS_CHUNK_SIZE: ${TBL_STATS_CHUNK_SIZE}
      TBL_STATS_RETENTION: ${TBL_STATS_RETENTION}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
      - ../em_health/sql:/sql:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./pgtune.sh:/usr/local/bin/pgtune.sh:ro
      - ./reset-db.sh:/usr/local/bin/reset-db.sh:ro
      - ./pgbackrest.conf:/etc/pgbackrest.conf:ro
      - ${BACKUP_DIR}:/backups
    command: >
      postgres
      -c shared_preload_libraries=timescaledb,pg_stat_statements,auto_explain
      -c pg_stat_statements.track_planning=on
      -c track_io_timing=on
      -c logging_collector=on
      -c log_destination='csvlog'
      -c log_rotation_size=0
      -c log_rotation_age=24h
      -c log_truncate_on_rotation=on
      -c log_filename='postgresql-%a.log'
      -c log_line_prefix=''
      -c log_autovacuum_min_duration=0
      -c auto_explain.log_format='json'
      -c auto_explain.log_min_duration=${MIN_QUERY_EXPLAIN}
      -c auto_explain.log_analyze=on
      -c auto_explain.log_buffers=on
      -c auto_explain.log_timing=off
      -c auto_explain.log_parameter_max_length=0
      -c archive_command='pgbackrest --stanza=main archive-push %p'
      -c archive_mode=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    networks:
      - emhealth-net

  renderer:
    image: docker.io/grafana/grafana-image-renderer:v5.12.11@sha256:e0c9a01cf23ffe3e0786c17bc3ae4fddfd688dfd5573c4e54ab928eead0627e6
    container_name: emhealth-renderer
    restart: unless-stopped
    shm_size: 2gb
    command: server --server.auth-token ${GRAFANA_RENDER_TOKEN}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    networks:
      - emhealth-net

  grafana:
    image: docker.io/grafana/grafana:13.3.1-slim@sha256:f4a05fb420ec25efa0faaa36a9cdfdad9d9505f4c3a8e600467d0a68a3329c71
    container_name: emhealth-grafana
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD} # initial password, used only on first startup
      GF_SECURITY_DISABLE_GRAVATAR: true
      GF_AUTH_ANONYMOUS_HIDE_VERSION: true
      GF_PLUGINS_PREINSTALL: yesoreyeram-infinity-datasource
      GF_LIVE_MAX_CONNECTIONS: 0
      GF_METRICS_ENABLED: false
      GF_SERVER_ENABLE_GZIP: true
      GF_SERVER_ROOT_URL: http://localhost
      GF_SERVER_SERVE_FROM_SUB_PATH: false
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED} # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#smtp
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_EMAIL_FROM}
      GF_SMTP_FROM_NAME: EMHealth
      GRAFANA_EMAIL_TO: ${GRAFANA_EMAIL_TO}
      GF_SMTP_SKIP_VERIFY: ${GRAFANA_SMTP_SKIP_VERIFY}
      GF_RENDERING_SERVER_URL: http://emhealth-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://emhealth-grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDER_TOKEN}
      GF_UNIFIED_ALERTING_SCREENSHOTS_CAPTURE: true # https://grafana.com/docs/grafana/latest/alerting/configure-notifications/template-notifications/images-in-notifications/#configuration
      GF_USERS_DEFAULT_THEME: system
      EMHEALTH_DEBUG: ${EMHEALTH_DEBUG}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    tmpfs:
      - /var/lib/grafana/plugins:rw,exec,nosuid,nodev   # keeps plugins in container only
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    networks:
      - emhealth-net

volumes:
  pgdata:
  grafana-storage:
networks:
  emhealth-net:
    name: emhealth-net
