[global]
# Repository
repo1-type=posix
repo1-path=/backups

# Retention policy
repo1-retention-full=2

# Compression
compress-type=zst
compress-level=4
process-max=4

# Logging
log-path=/var/log/pgbackrest
log-level-console=warn
log-level-file=info
log-timestamp=y

# Safety
archive-check=y

# Performance / stability
start-fast=y
delta=y

[main]
pg1-path=/var/lib/postgresql/18/docker
