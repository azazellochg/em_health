apiVersion: 1

# Datasource uid must be hardcoded otherwise Grafana will generate it randomly on every restart. We rely on this uid in the alert rules
# https://grafana.com/docs/grafana/latest/upgrade-guide/upgrade-v11.2/#correct-uid-format

datasources:
  - name: tem
    type: postgres
    uid: hm-tem
    isDefault: true
    url: "emhealth-db:5432"
    user: "grafana"
    secureJsonData:
      password: "$POSTGRES_GRAFANA_PASSWORD"
    jsonData:
      database: tem
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true

  - name: sem
    type: postgres
    uid: hm-sem
    isDefault: false
    url: "emhealth-db:5432"
    user: "grafana"
    secureJsonData:
      password: "$POSTGRES_GRAFANA_PASSWORD"
    jsonData:
      database: sem
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
