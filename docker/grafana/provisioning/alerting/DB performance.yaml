        - uid: bfvjvdnpj04xsa
          title: Bloat - VACUUM Blocked by Xmin Horizon
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: hm-tem
              model:
                dataset: tem
                editorMode: code
                format: table
                intervalMs: 1000
                maxDataPoints: 43200
                rawQuery: true
                rawSql: |-
                    WITH current_horizon AS (
                      SELECT
                        xmin_horizon
                      FROM
                        pganalyze.database_stats
                      WHERE
                        xmin_horizon <> 0
                      ORDER BY
                        collected_at DESC
                      LIMIT
                        1
                    ), horizon_age AS (
                      SELECT
                        MIN(ds.collected_at) AS assigned_at
                      FROM
                        pganalyze.database_stats ds
                        CROSS JOIN current_horizon ch
                      WHERE
                        ds.xmin_horizon = ch.xmin_horizon
                    )
                    SELECT
                      CASE
                        WHEN assigned_at < now() - interval '24 hours' THEN 1
                        ELSE 0
                      END AS value
                    FROM
                      horizon_age;
