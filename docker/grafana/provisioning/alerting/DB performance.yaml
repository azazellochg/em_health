          annotations:
            Impact: When fsync is turned off, an unpredictable shutdown (e.g., a power failure) can leave your entire server unusable.
            Solution: If you need a performance boost but you are okay with losing some commits, consider setting synchronous_commit to off instead, which has most of the same performance benefits, but will leave the database server in a stable state even after a crash.
            summary: Detects when the Postgres setting fsync is turned off and creates an issue with severity "critical". Resolves once fsync is enabled again.
          labels:
