        - uid: efvjqhgo0a0aoc
          title: Too small shared_buffers
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: hm-tem
              model:
                dataset: tem
                editorMode: code
                format: table
                intervalMs: 1000
                maxDataPoints: 43200
                rawQuery: true
                rawSql: |-
                    SELECT
                      CASE
                        WHEN mem_total < 2147483648 :: bigint THEN (
                          pg_size_bytes(current_setting('shared_buffers')) < mem_total :: numeric * 0.20
                        ) :: int
                        WHEN mem_total < 34359738368 :: bigint THEN (
                          pg_size_bytes(current_setting('shared_buffers')) < mem_total :: numeric * 0.25
                        ) :: int
                        ELSE (
                          pg_size_bytes(current_setting('shared_buffers')) < 8589934592 :: bigint
                        ) :: int
                      END AS value
                    FROM
                      pganalyze.sys_stats
                    ORDER BY
                      time DESC
                    LIMIT
                      1
                refId: A
                sql:
                    columns:
                        - parameters: []
                          type: function
                    groupBy:
                        - property:
                            type: string
                          type: groupBy
                    limit: 50
            - refId: reducer
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: reducer
                type: reduce
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: reducer
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          annotations:
            Impact: If the memory allocated to Postgres is too small, it will need to perform more reads and writes from disk, decreasing performance.
            Solution: |-
                The ideal shared_buffers setting depends on your workload, but pganalyze uses the following rule of thumb:

                20% of RAM for systems with less than 2GB
                25% of RAM for systems with less than 32GB
                8GB for systems with 32GB or more
                Postgres also relies on the operating system page cache, so giving it additional memory beyond the recommended values is not helpful and may be detrimental. For large servers or busy systems we recommend benchmarking to get to the best shared_buffers configuration for your specific workload.

                Update the setting to the recommended value.
            summary: Detects when the shared_buffers Postgres setting seems too low for the amount of RAM in your machine, and creates an issue with severity "warning". Resolves once the setting has been adjusted to within the recommended range.
          labels:
            module: config
            severity: warning
          isPaused: false
          notification_settings:
            receiver: email-contact-point
        - uid: efvjr1ve7lc74a
          title: Too small work_mem
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: hm-tem
              model:
                dataset: tem
                editorMode: code
                format: table
                intervalMs: 1000
                maxDataPoints: 43200
                rawQuery: true
                rawSql: |-
                    SELECT
                      (
                        pg_size_bytes(current_setting('work_mem')) < GREATEST(
                          1048576 :: bigint,
                          LEAST(
                            (
                              mem_total :: numeric - pg_size_bytes(current_setting('shared_buffers'))
                            ) / current_setting('max_connections') :: bigint,
                            268435456 :: bigint
                          )
                        )
                      ) :: int AS value
                    FROM
                      pganalyze.sys_stats
                    ORDER BY
                      time DESC
                    LIMIT
                      1;
                refId: A
                sql:
                    columns:
                        - parameters: []
                          type: function
                    groupBy:
                        - property:
                            type: string
                          type: groupBy
                    limit: 50
            - refId: reducer
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: reducer
                type: reduce
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: reducer
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          annotations:
            Impact: The Postgres work_mem setting controls how much memory individual sort and hash operations can consume. These are used while executing queries to evaluate sorts, joins, and other query features. If set too low, can cause queries to create temporary files on disk more often, which will affect performance.
            Solution: |-
                The ideal work_mem setting depends heavily on your workload, but pganalyze uses the following rule of thumb:

                - start with dividing shared_buffers by max_connections
                - use no less than 1MB
                - use no more than 256MB

                Update the setting to the recommended value by using ALTER SYSTEM  or modifying the parameters in your cloud provider portal.
            summary: Detects when the Postgres work_mem setting seems too low for the amount of RAM in your machine and the number of connections you have configured, and creates an issue with severity "warning".
          labels:
            module: config
            severity: warning
          isPaused: false
          notification_settings:
            receiver: email-contact-point
        - uid: bfvjvdnpj04xsa
          title: Bloat - VACUUM Blocked by Xmin Horizon
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: hm-tem
              model:
                dataset: tem
                editorMode: code
                format: table
                intervalMs: 1000
                maxDataPoints: 43200
                rawQuery: true
                rawSql: |-
                    WITH current_horizon AS (
                      SELECT
                        xmin_horizon
                      FROM
                        pganalyze.database_stats
                      WHERE
                        xmin_horizon <> 0
                      ORDER BY
                        collected_at DESC
                      LIMIT
                        1
                    ), horizon_age AS (
                      SELECT
                        MIN(ds.collected_at) AS assigned_at
                      FROM
                        pganalyze.database_stats ds
                        CROSS JOIN current_horizon ch
                      WHERE
                        ds.xmin_horizon = ch.xmin_horizon
                    )
                    SELECT
                      CASE
                        WHEN assigned_at < now() - interval '24 hours' THEN 1
                        ELSE 0
                      END AS value
                    FROM
                      horizon_age;
                refId: A
                sql:
                    columns:
                        - parameters: []
                          type: function
                    groupBy:
                        - property:
                            type: string
                          type: groupBy
                    limit: 50
            - refId: reducer
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: reducer
                type: reduce
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: reducer
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          annotations:
            Impact: |-
                VACUUM is potentially blocked by the xmin horizon.

                The xmin horizon tells you up to which point the vacuum process can clean up dead rows. When this value is behind and not advancing, VACUUMs will be blocked and will not be able to clean up dead rows.

                When VACUUM is blocked and dead rows can't be cleaned, it can result in table bloat and slow queries.

                The xmin horizon tracked by pganalyze is the oldest xmin across all databases, summarized as a server-wide metric. Note that while some types of xmin horizon delays affect all databases on a server, such as the xmin for each physical replication slots, in other cases not all databases of a server will be impacted, as Postgres can still clean up dead rows of tables on unrelated databases. For example, if the xmin horizon is held back by a long running transaction on database1, Postgres can still clean up dead rows of tables in database2, as the transaction of database1 will never be able to see database2.
            Solution: See https://pganalyze.com/docs/checks/vacuum/xmin_horizon
            summary: Detects when the xmin horizon on the server was assigned more than 24 hours ago and creates an issue with severity "warning". The issue will be created even if no VACUUM is currently blocked by this, as this will potentially block any future VACUUMs. Resolves once the assignment age of the xmin horizon is under the threshold.
          labels:
            module: vacuum
            severity: warning
          isPaused: false
          notification_settings:
            receiver: email-contact-point
        - uid: afvjx5flc97uof
          title: Freezing - Approaching Transaction ID Wraparound
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: hm-tem
              model:
                dataset: tem
                editorMode: code
                format: table
                intervalMs: 1000
                maxDataPoints: 43200
                rawQuery: true
                rawSql: |-
                    SELECT
                      ROUND(
                        100.0 * MAX(age(datfrozenxid)) / 4294967296,
                        4
                      ) AS xid_utilization_percent
                    FROM
                      pg_database;
                refId: A
                sql:
                    columns:
                        - parameters: []
                          type: function
                    groupBy:
                        - property:
                            type: string
                          type: groupBy
                    limit: 50
            - refId: reducer
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: reducer
                type: reduce
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 50
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: reducer
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          annotations:
            Common Causes: |-
                - Ineffectual autovacuum settings
                Autovacuums, especially anti-wraparound autovacuums, are meant to freeze old transaction IDs and keep sufficient transaction IDs available in order to prevent wraparound from happening. When autovacuum is turned off, or autovacuum settings are not well suited to actual database usage, it is possible that autovacuum is not able to keep up with freezing old transaction IDs. Make sure that autovacuum is turned on, and revisit the configuration settings to ensure that autovacuum will keep transaction ID space utilization under control. You can check out the configuration settings related to freezing.

                - Blocked autovacuums
                Even if autovacuum settings are adequate, it is possible that autovacuums themselves are blocked by something, hence freezing (to reduce transaction ID space utilization) is not able to keep up. The typical blocker is a long running transaction, or a transaction holding some locks that could cancel autovacuums. It is important to make sure that there is no such transactions so that VACUUMs can make freezing progress. Check for any long-running transactions and their lock state.
            Impact: |-
                Transaction ID space utilization is high and approaching wraparound.

                Postgres runs autovacuums regularly and this helps keeping transaction ID space utilization low by freezing old transaction IDs. There is also the anti-wraparound autovacuum specific for freezing, when the regular autovacuums are either not freezing aggressively enough or simply not running. This anti-wraparound autovacuum will be triggered when utilization (age) exceeds the threshold, specified in autovacuum_freeze_max_age.

                In order to avoid wraparound failure, old transaction IDs must be frozen by VACUUMs. The more old transaction IDs need to be frozen, the more expensive VACUUM becomes. It can take a really long time to finish and potentially causes overall performance degradation. The anti-wraparound autovacuum holds aSHARE UPDATE EXCLUSIVE lock, which can block DDL statements.

                If transaction ID space utilization reaches to 99.85% (3M transaction IDs left), the system will shut down. This is to prevent any data corruption from happening by running out transaction IDs. Resolving this requires manual intervention.

                With Postgres 14+, there is a special type of failsafe VACUUM which takes extraordinary measures to avoid the shutdown. While this is very useful, you still want to avoid this as a failsafe autovacuum ignores resource utilization constraints and can have significant performance impact.
            summary: Detects when transaction ID space utilization on the server is more than 50% and creates an issue with severity "warning".  Resolves once utilization falls below the threshold.
          labels:
            module: vacuum
            severity: warning
          isPaused: false
          notification_settings:
            receiver: email-contact-point
        - uid: ffvjxgah88pogf
          title: Freezing - Approaching Multixact ID Wraparound
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: hm-tem
              model:
                dataset: tem
                editorMode: code
                format: table
                intervalMs: 1000
                maxDataPoints: 43200
                rawQuery: true
                rawSql: |-
                    SELECT
                      ROUND(
                        100.0 * MAX(mxid_age(datminmxid)) / 4294967296,
                        4
                      ) AS mxid_utilization_percent
                    FROM
                      pg_database;
                refId: A
                sql:
                    columns:
                        - parameters: []
                          type: function
                    groupBy:
                        - property:
                            type: string
                          type: groupBy
                    limit: 50
            - refId: reducer
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: reducer
                type: reduce
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 50
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: reducer
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          annotations:
            Common Causes: |-
                - Ineffectual autovacuum settings
                Autovacuums, especially anti-wraparound autovacuums, are meant to freeze old multixact IDs and keep sufficient multixact IDs available in order to prevent wraparound from happening. When autovacuum is turned off, or autovacuum settings are not well suited to actual database usage, it is possible that autovacuum is not able to keep up with freezing old multixact IDs. Make sure that autovacuum is turned on, and revisit the configuration settings to ensure that autovacuum will keep multixact ID space utilization under control. You can check out the configuration settings related to freezing.

                - Blocked autovacuums
                Even if autovacuum settings are adequate, it is possible that autovacuums themselves are blocked by something, hence freezing (to reduce multixact ID space utilization) is not able to keep up. The typical blocker is a long running transaction, or a transaction holding some locks that could cancel autovacuums. It is important to make sure that there is no such transactions so that VACUUMs can make freezing progress. Check for any long-running transactions and their lock state.
            Impact: |-
                Multixact ID space utilization is high and approaching wraparound.

                This is about multixact IDs, not about normal transaction IDs. A multixact ID is an internal identifier used to support row locking by multiple transactions. Multixact IDs are commonly used with SELECT ... FOR UPDATE queries.

                Postgres runs autovacuums regularly and this helps keeping multixact ID space utilization low by freezing old multixact IDs. There is also the anti-wraparound autovacuum specifically for freezing, when the regular autovacuums are either not freezing aggressively enough or simply not running. This anti-wraparound autovacuum will be triggered when utilization (age) exceeds the threshold, specified in autovacuum_multixact_freeze_max_age.

                In order to avoid wraparound failure, old multixact IDs must be frozen by VACUUMs. The more old multixact IDs need to be frozen, the more expensive VACUUM becomes. It can take a really long time to finish and potentially cause overall performance degradation. The anti-wraparound autovacuum holds a SHARE UPDATE EXCLUSIVE lock, which can block DDL statements.

                If multixact ID space utilization reaches to 99.85% (3M multixact IDs left), the system will shut down. This is to prevent any data corruption from happening by running out multixact IDs. Resolving this requires manual intervention.

                With Postgres 14+, there is a special type of failsafe VACUUM which takes extraordinary measures to avoid the shutdown. While this is very useful, you still want to avoid this as a failsafe autovacuum ignores resource utilization constraints and can have significant performance impact.
            summary: Detects when multixact ID space utilization on the server is more than 50% and creates an issue with severity "warning". Resolves once utilization falls below the threshold.
          labels:
            module: vacuum
            severity: warning
          isPaused: false
          notification_settings:
            receiver: email-contact-point
